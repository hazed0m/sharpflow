name: Deploy to Supabase

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci --verbose

      - name: Build
        run: npm run build

      - name: Show environment & diagnostics
        run: |
          echo "--- node/npm ---"
          node -v || true
          npm -v || true
          echo "--- tsc/vite ---"
          npx tsc -v || true
          npx vite --version || true
          echo "--- npm config ---"
          npm config ls
          echo "--- env (filtered) ---"
          printenv | sort | grep -E "NODE|NPM|GITHUB|CI|RUNNER|ACTIONS|SUPABASE" || true
          echo "--- disk / ls ---"
          df -h || true
          ls -la

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase login --access-token $SUPABASE_ACCESS_TOKEN || true
          supabase link --project-ref $SUPABASE_PROJECT_REF || true

      - name: Push DB migrations (RLS policies)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase db push --project-ref $SUPABASE_PROJECT_REF

      - name: Deploy Functions (MCP)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy mcp --project-ref $SUPABASE_PROJECT_REF --no-verify-jwt

      - name: Deploy Static Site to Supabase Hosting
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase hosting deploy ./dist --project-ref $SUPABASE_PROJECT_REF
